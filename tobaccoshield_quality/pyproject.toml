[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tobaccoshield-quality"
version = "1.0.0"
description = "TobaccoShield Image Quality & Preprocessing Module (Member B)"
requires-python = ">=3.9"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.26",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tobaccoshield_quality*"]
